# Puente temporal: la wiki bloquea la máquina local, pero responde desde GitHub Actions.
# Publica las muestras en la rama `pcgw-samples` (no en main).
name: PCGW sample

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/pcgw-sample.yml
      - .github/scripts/pcgw_sample.py

permissions:
  contents: write

concurrency: pcgw-sample

jobs:
  sample:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download samples from PCGamingWiki
        env:
          PCGW_BOT_USERNAME: ${{ secrets.PCGW_BOT_USERNAME }}
          PCGW_BOT_PASSWORD: ${{ secrets.PCGW_BOT_PASSWORD }}
        run: python3 .github/scripts/pcgw_sample.py out

      - name: Publish to pcgw-samples branch
        if: always()
        run: |
          cd out
          git init -q -b pcgw-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "PCGamingWiki samples from run ${{ github.run_id }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" pcgw-samples
